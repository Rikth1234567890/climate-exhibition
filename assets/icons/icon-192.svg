<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" role="img" aria-label="Earth's Climate exhibition icon">
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="#080f1f"/>
  <!-- Globe circle -->
  <circle cx="96" cy="96" r="60" fill="none" stroke="#38bdf8" stroke-width="4"/>
  <!-- Equator line -->
  <ellipse cx="96" cy="96" rx="60" ry="20" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <!-- Vertical meridian -->
  <line x1="96" y1="36" x2="96" y2="156" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <!-- Warming curve (rising line, red-orange) -->
  <polyline
    points="46,120 62,112 78,108 94,100 110,88 126,76 146,62"
    fill="none"
    stroke="#f97316"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  <!-- Sun rays (amber) -->
  <circle cx="152" cy="44" r="12" fill="#f5a623"/>
  <line x1="152" y1="26" x2="152" y2="20" stroke="#f5a623" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="152" y1="62" x2="152" y2="68" stroke="#f5a623" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="134" y1="44" x2="128" y2="44" stroke="#f5a623" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="170" y1="44" x2="176" y2="44" stroke="#f5a623" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="139" y1="31" x2="135" y2="27" stroke="#f5a623" stroke-width="2" stroke-linecap="round"/>
  <line x1="165" y1="57" x2="169" y2="61" stroke="#f5a623" stroke-width="2" stroke-linecap="round"/>
  <line x1="165" y1="31" x2="169" y2="27" stroke="#f5a623" stroke-width="2" stroke-linecap="round"/>
  <line x1="139" y1="57" x2="135" y2="61" stroke="#f5a623" stroke-width="2" stroke-linecap="round"/>
</svg>
